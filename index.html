<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADN_LINK TEC 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; overscroll-behavior-y: none; user-select: none; }
        .page { display: none; opacity: 0; transition: opacity 0.2s; }
        .page.active { display: block; opacity: 1; }
        #toast { visibility: hidden; min-width: 250px; background: #333; color: #fff; text-align: center; border-radius: 50px; padding: 16px; position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); z-index: 100; opacity: 0; transition: 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 100px; }
        .mercenary-glow { box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); border: 1px solid #ef4444; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden">

    <header class="bg-white shadow-sm px-4 py-3 flex justify-between items-center h-16 shrink-0">
        <h1 class="text-xl font-bold text-gray-800" id="header-title">ADN_LINK TEC</h1>
        <div class="flex gap-2">
            <span id="mode-badge" class="text-[10px] bg-green-100 text-green-600 px-2 py-1 rounded-full font-bold uppercase">Go Home</span>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto bg-gray-50 pb-20">
        
        <div id="home-page" class="page active p-4 space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase text-center">Entrada de Prompt</label>
                <textarea id="prompt-input" class="w-full h-24 p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Escribe aquí tu idea..."></textarea>
                
                <div class="grid grid-cols-2 gap-2 mt-3">
                    <select id="style-select" class="bg-gray-50 border p-2 rounded-lg text-xs">
                        <option value="standard">Estilo: Standard</option>
                        <option value="raw">Estilo: Mercenary RAW</option>
                        <option value="4k">Estilo: Ultra HD</option>
                    </select>
                    <select id="size-select" class="bg-gray-50 border p-2 rounded-lg text-xs">
                        <option value="1024x1024">1:1 (Cuadrado)</option>
                        <option value="1920x1080">16:9 (TV)</option>
                    </select>
                </div>

                <button onclick="ejecutarADN()" class="w-full mt-4 bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg active:scale-95 transition-transform">
                    GENERAR CON ADN_LINK
                </button>
            </div>

            <div id="preview-area" class="hidden space-y-2">
                <h3 class="text-xs font-bold text-gray-400 uppercase">Resultado en Cache Local</h3>
                <div id="output-container" class="bg-gray-200 rounded-2xl aspect-square flex items-center justify-center overflow-hidden border-2 border-dashed border-gray-300">
                    <p class="text-gray-400 text-xs">Esperando procesamiento...</p>
                </div>
            </div>
        </div>

        <div id="info-page" class="page p-4">
            <h2 class="font-bold">Configuración ADN_LINK</h2>
            <p class="text-sm text-gray-500">Material entrelazado con Perchance.org activo.</p>
        </div>

    </main>

    <nav class="bg-white border-t flex justify-around items-center h-16 fixed bottom-0 w-full">
        <button onclick="changeTab('home')" class="flex flex-col items-center text-blue-600"><i class="ph ph-house text-2xl"></i><span class="text-[10px]">Inicio</span></button>
        <button onclick="changeTab('info')" class="flex flex-col items-center text-gray-400"><i class="ph ph-shield-check text-2xl"></i><span class="text-[10px]">Seguridad</span></button>
    </nav>

    <div id="toast"></div>

    <script>
        function showToast(m) { const t=document.getElementById("toast"); t.innerText=m; t.className="show"; setTimeout(()=>t.className="",3000); }
        
        function changeTab(t) {
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
            document.getElementById(t+"-page").classList.add('active');
        }

        async function ejecutarADN() {
            const prompt = document.getElementById("prompt-input").value;
            const estilo = document.getElementById("style-select").value;
            const tamaño = document.getElementById("size-select").value;
            const badge = document.getElementById("mode-badge");
            const preview = document.getElementById("preview-area");

            if(!prompt) return showToast("Introduce un prompt");

            // Lógica Vision Advanced Tag's
            const isMercenary = prompt.toLowerCase().includes("mercenary") || estilo === "raw";
            
            preview.classList.remove("hidden");
            document.getElementById("output-container").innerHTML = '<div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>';

            if(isMercenary) {
                badge.innerText = "MERCENARY MODE";
                badge.className = "text-[10px] bg-red-100 text-red-600 px-2 py-1 rounded-full font-bold uppercase";
                showToast("Accediendo a Perchance (Mercenary)...");
                
                // Redirección o Inyección de Perchance (Simulada para el rincón secreto)
                setTimeout(() => {
                    document.getElementById("output-container").innerHTML = 
                        `<iframe src="https://perchance.org/k1wau93cx4?prompt=${encodeURIComponent(prompt)}" class="w-full h-full border-none"></iframe>`;
                    showToast("Guardado en Cache Local");
                }, 1500);
            } else {
                badge.innerText = "GO HOME";
                badge.className = "text-[10px] bg-green-100 text-green-600 px-2 py-1 rounded-full font-bold uppercase";
                showToast("Procesando con Google Standard...");
                setTimeout(() => {
                    document.getElementById("output-container").innerHTML = '<p class="text-gray-500 p-4 text-center text-xs">Material seguro procesado por Google Vision.</p>';
                }, 1500);
            }
        }
    </script>
</body>
</html>
